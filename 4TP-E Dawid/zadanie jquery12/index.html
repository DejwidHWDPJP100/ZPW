<html>
    <head>
        <title>wprowadzenie jquery</title>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
        <script>
            $(function(){
                $("#newsletter").change(function(){
                    if($(this).is(":checked")){
                        $("#stan").text("zapisano")
                    }else{
                        $("#stan").text("wypisano")
                    }
                })
                $("#regulamin").change(function(){
                    if($(this).is(":checked")){
                        $("#zarejestruj").prop("disabled",false)
                    }else{
                        $("#zarejestruj").prop("disabled",true)
                    }
                })
                $("#tekst").on("input",function(){
                    $("#podglad").text($(this).val())
                })
                $("#area").on("input",function(){
                    let charactersLeft = 100-$(this).val().length
                    $("#licznik").text(charactersLeft)
                    if(charactersLeft < 10){
                        $("#licznik").css("color","red")
                    }else{
                        $("#licznik").css("color","black")
                    }
                })
                    
            })
            
        </script>
        <style>

        </style>
    </head>
    <body>
        <input type="checkbox" id="newsletter">
        <p id="stan"></p>
        <hr>
        <form id="register">
            <input type="checkbox" id="regulamin"> Akceptuje regulamin
            <button id="zarejestruj" disabled>Zarejestruj</button>
        </form>
        <hr>
        <input type="text" id="tekst">
        <p>Podgląd: <span id="podglad"></span></p>
        <hr>
        <textarea id="area" maxlength="100"></textarea>
        <p>Pozostało znaków: <span id="licznik">100</span></p>
    </body>
</html>
