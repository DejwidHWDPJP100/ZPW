<html>
    <head>
        <title>Wprowadzenie jquery</title>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
        <script>
            $(function(){
                $("#zmien").click(function(){
                    $("#tekst").text("Nowy tekst")
                });
                $("#przelacz").click(function(){
                    $("#brek").toggle()
                });
                $(".klik").click(function(){
                    $(this).toggleClass("podswietlony");
                });
                $("#przywitaj").click(function(){
                    if($("#imie").val().trim() !== ""){
                        $("#wynik").text("Witaj, "+ $("#imie").val() + "!")
                    }else{
                        $("#wynik").text("Podaj imie")
                    }
                })
                $("#akceptuje").change(function(){
                    if(this.checked){
                        $("#wyslij").removeAttr("disabled")
                    }else{
                        $("#wyslij").attr("disabled","disabled");
                    }
                })
                $("li").each(function(index,element){
                    $(element).text((index +1)+"."+$(element).text())
                })
                $("#zaloguj").click(function(){
                    if($("#login").val().length > 3 && $("#haslo").val().length > 6){
                        $("#komunikat").text("Zalogowano").css("color","green")
                    }else{
                        $("#komunikat").text("popraw").css("color","red")
                    }
                })
            });
        </script>
        <style>
            .podswietlony{
                background-color: yellow;
            }
        </style>
    </head>
    <body>

          <p id="tekst">Stary tekst</p>
          <button id="zmien"> Zmień</button>
          <div id="brek">widzisz mnie</div>
          <button id="przelacz"> Widze cie brek</button>
          <p class="klik">kliknij mnie</p>
          <input type="text" id="imie">
          <button id="przywitaj">Przywitaj</button>
          <p id="wynik"></p>
          <label> <input type="checkbox" id="akceptuje"> Akceptuj</label>
          <button id="wyslij" disabled>wyslij</button>
          <ul id="menu">
            <li>Strona główna</li>
            <li>O nas</li>
            <li>Kontakt</li>
          </ul>
          <input type="text" id="login">
          <input type="password" id="haslo">
          <button id="zaloguj">Zaloguj</button>
          <p id="komunikat"></p>
          
    </body>
</html>
