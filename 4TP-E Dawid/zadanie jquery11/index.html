<html>
    <head>
        <title>wprowadzenie jquery</title>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
        <script>
            $(function(){
                $("#formularz").submit(function(e){
                    e.preventDefault();
                    if($("#nick").val() === "" ){
                        $("#info").text("Podaj nick!")
                    }else{
                        $("#info").text("wysłano!");
                    }
                })
                $("#form").submit(function(e){
                    e.preventDefault();
                    if($("#haslo").val().length < 6){
                        $("#alert").text("Hasło jest za krótkie!").css("color","red")
                    } else{
                        $("#alert").text("Zalogowano!").css("color","green")
                    }
                })
                $("#color").change(function(){
                    $("body").css("background-color",$(this).val())
                })
                $("#pizza").change(function(){
                    $("#cena").text("Do zaplaty: "+ $(this).val() + "zł.")
                })
            })
            
        </script>
        <style>

        </style>
    </head>
    <body>
        <form id="formularz">
            <input type="text" id="nick">
            <button type="submit">Wyślij</button>
        </form>
        <p id="info"></p>
        <hr>
        <form id="form">
            <input type="text" id="mail">
            <input type="password" id="haslo">
            <button type="submit">Loguj</button>
        </form>
        <p id="alert"></p>
        <hr>
        <select id="color">
            <option value="white">Biały</option>
            <option value="yellow">Żółty</option>
            <option value="blue">Niebieski</option>
        </select>
        <hr>
        <select id="pizza">
            <option value="20">Mała</option>
            <option value="30">Średnia</option>
            <option value="40">Duża</option>
        </select>
        <p id="cena"></p>
        
    </body>
</html>
